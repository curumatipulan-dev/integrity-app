name: Patch AI provider
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_ai.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_ai.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app.js
          git diff --staged --quiet || git commit -m "feat: switch AI provider from DeepSeek to Lovable AI"
          git push
